services:
  postgres:
    ports: !override
      - "127.0.0.1:5434:5432"
    volumes:
      - clean_test_pgdata:/var/lib/postgresql/data

  api:
    ports: !override
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:5006:5005"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ulwembu

  frontend:
    build:
      context: ../E-Health-Frontend
    ports: !override
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8081
    volumes:
      - ../E-Health-Frontend:/app
      - clean_test_frontend_node_modules:/app/node_modules

volumes:
  clean_test_pgdata:
  clean_test_frontend_node_modules:
