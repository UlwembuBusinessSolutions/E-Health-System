services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ulwembu
      POSTGRES_USER: ulwembu
      # Matches application.yml's local-dev default
      POSTGRES_PASSWORD: ulwembu_dev_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulwembu -d ulwembu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8081:8081"
      - "5005:5005"
    environment:
      # Inside Docker, PostgreSQL is reachable using the
      # Docker Compose service name "postgres".
      DB_URL: jdbc:postgresql://postgres:5432/ulwembu
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend/E-Health-System

    ports:
      - "5173:5173"

    environment:
      VITE_API_BASE_URL: http://localhost:8081

    volumes:
      # Mount the frontend source code for Vite hot reload.
      - ../../frontend/E-Health-System:/app

      # Keep container's Linux node_modules separate from the host.
      - frontend_node_modules:/app/node_modules

    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules: