name: e-health-system-dev-backend-ulwembu

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ulwembu
      POSTGRES_USER: ulwembu
      POSTGRES_PASSWORD: ulwembu_dev_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulwembu -d ulwembu"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ulwembu
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../E-Health-System-dev-frontend-ulwembu
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8081
    ports:
      - "5173:5173"
    volumes:
      - ../E-Health-System-dev-frontend-ulwembu:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  frontend_node_modules: