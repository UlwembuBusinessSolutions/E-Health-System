services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ulwembu
      POSTGRES_USER: ulwembu
      # Matches application.yml's own local-dev default exactly
      # (spring.datasource.password: ${DB_PASSWORD:ulwembu_dev_local}) — so
      # the api service below, with nothing else set, just connects.
      POSTGRES_PASSWORD: ulwembu_dev_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulwembu -d ulwembu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8081:8081"
    environment:
      # The only override actually needed. application.yml's own default
      # (localhost:5432) assumes the app runs on the host — inside this
      # compose network, Postgres is reachable at its service name,
      # "postgres", not localhost (that would resolve to the api
      # container itself, where nothing is listening on 5432).
      DB_URL: jdbc:postgresql://postgres:5432/ulwembu
      DB_USERNAME: ulwembu
      DB_PASSWORD: ulwembu_dev_local
      SMTP_HOST: ${SMTP_HOST:-smtp-mail.outlook.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFICATIONS_FROM_ADDRESS: ${NOTIFICATIONS_FROM_ADDRESS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Everything else — JWT secrets, PLATFORM_BOOTSTRAP_*, SMTP, AWS —
      # keeps application.yml's own baked-in local-dev defaults. SMTP and
      # FRONTEND_BASE_URL are forwarded above so account emails use a real
      # mailbox and contain a URL the recipient can actually open.
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../Frontend
    ports:
      - "5173:5173"
    environment:
      # Read by the browser, not by this container — the Vite dev server
      # ships this into the bundle it serves, and the browser then calls
      # the API directly from the host machine. "api:8081" (the compose
      # network's own hostname for the api service) would only resolve
      # from inside another container, not from the browser, so this has
      # to be the same host-facing address api's own "8081:8081" port
      # mapping above already publishes.
      VITE_API_BASE_URL: http://localhost:8081
    volumes:
      # Bind-mount the source for hot reload, but let the image's own
      # node_modules (installed for linux/the container's arch during
      # `docker-compose build`) win inside the container — without this
      # second, more specific mount, the bind mount above would shadow it
      # with whatever (or nothing) is in node_modules on the host.
      - ../Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules:
