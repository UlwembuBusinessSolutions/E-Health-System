services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ulwembu
      POSTGRES_USER: ulwembu
      POSTGRES_PASSWORD: ulwembu_dev_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulwembu -d ulwembu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8081:8081"
      - "5005:5005"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ulwembu
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATIONS_FROM_ADDRESS: ${NOTIFICATIONS_FROM_ADDRESS:-no-reply@ulwembu.example}
      NOTIFICATIONS_CAPTURE_DIR: ${NOTIFICATIONS_CAPTURE_DIR:-./data/emails}
      AWS_SMS_REGION: ${AWS_SMS_REGION:-eu-west-1}
      AWS_SMS_ENABLED: ${AWS_SMS_ENABLED:-false}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN:-}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
      META_WHATSAPP_API_VERSION: ${META_WHATSAPP_API_VERSION:-v26.0}
      META_WHATSAPP_QUEUE_TEMPLATE_NAME: ${META_WHATSAPP_QUEUE_TEMPLATE_NAME:-}
      META_WHATSAPP_TEMPLATE_LANGUAGE: ${META_WHATSAPP_TEMPLATE_LANGUAGE:-en_US}
      META_WHATSAPP_ENABLED: ${META_WHATSAPP_ENABLED:-false}
      META_WHATSAPP_TEMPLATE_MEDICATION_READY: ${META_WHATSAPP_TEMPLATE_MEDICATION_READY:-ulwembu_medication_ready}
      META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTION_REMINDER: ${META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTION_REMINDER:-ulwembu_medication_collection_reminder}
      META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTION_OVERDUE: ${META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTION_OVERDUE:-ulwembu_medication_collection_overdue}
      META_WHATSAPP_TEMPLATE_MEDICATION_PARTIALLY_READY: ${META_WHATSAPP_TEMPLATE_MEDICATION_PARTIALLY_READY:-ulwembu_medication_partially_ready}
      META_WHATSAPP_TEMPLATE_MEDICATION_DELAYED: ${META_WHATSAPP_TEMPLATE_MEDICATION_DELAYED:-ulwembu_medication_delayed}
      META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTED: ${META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTED:-ulwembu_medication_collected}
      META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTION_CHANGED: ${META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTION_CHANGED:-ulwembu_medication_collection_changed}
      META_WHATSAPP_TEMPLATE_REPEAT_PRESCRIPTION_REVIEW: ${META_WHATSAPP_TEMPLATE_REPEAT_PRESCRIPTION_REVIEW:-ulwembu_repeat_prescription_review}
      META_WHATSAPP_TEMPLATE_APPOINTMENT_CONFIRMED: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_CONFIRMED:-ulwembu_appointment_confirmed}
      META_WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER:-ulwembu_appointment_reminder}
      META_WHATSAPP_TEMPLATE_APPOINTMENT_TODAY: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_TODAY:-ulwembu_appointment_today}
      META_WHATSAPP_TEMPLATE_APPOINTMENT_RESCHEDULED: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_RESCHEDULED:-ulwembu_appointment_rescheduled}
      META_WHATSAPP_TEMPLATE_APPOINTMENT_CANCELLED: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_CANCELLED:-ulwembu_appointment_cancelled}
      META_WHATSAPP_TEMPLATE_APPOINTMENT_MISSED: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_MISSED:-ulwembu_appointment_missed}
      META_WHATSAPP_TEMPLATE_APPOINTMENT_REQUEST_RECEIVED: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_REQUEST_RECEIVED:-ulwembu_appointment_request_received}
      META_WHATSAPP_TEMPLATE_APPOINTMENT_WAITLIST_OFFER: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_WAITLIST_OFFER:-ulwembu_appointment_waitlist_offer}
      META_WHATSAPP_TEMPLATE_VISIT_CHECKED_IN: ${META_WHATSAPP_TEMPLATE_VISIT_CHECKED_IN:-ulwembu_visit_checked_in}
      META_WHATSAPP_TEMPLATE_QUEUE_CALLED: ${META_WHATSAPP_TEMPLATE_QUEUE_CALLED:-ulwembu_queue_called}
      META_WHATSAPP_TEMPLATE_FOLLOW_UP_REQUESTED: ${META_WHATSAPP_TEMPLATE_FOLLOW_UP_REQUESTED:-ulwembu_follow_up_requested}
      META_WHATSAPP_TEMPLATE_RESULTS_AVAILABLE: ${META_WHATSAPP_TEMPLATE_RESULTS_AVAILABLE:-ulwembu_results_available}
      META_WHATSAPP_TEMPLATE_SECURE_MESSAGE: ${META_WHATSAPP_TEMPLATE_SECURE_MESSAGE:-ulwembu_secure_message}
      META_WHATSAPP_TEMPLATE_PATIENT_WELCOME: ${META_WHATSAPP_TEMPLATE_PATIENT_WELCOME:-ulwembu_patient_welcome}
      META_WHATSAPP_TEMPLATE_PATIENT_VERIFICATION_CODE: ${META_WHATSAPP_TEMPLATE_PATIENT_VERIFICATION_CODE:-ulwembu_patient_verification_code}
      META_WHATSAPP_TEMPLATE_PASSWORD_RESET_CODE: ${META_WHATSAPP_TEMPLATE_PASSWORD_RESET_CODE:-ulwembu_password_reset_code}
      META_WHATSAPP_TEMPLATE_PASSWORD_CHANGED: ${META_WHATSAPP_TEMPLATE_PASSWORD_CHANGED:-ulwembu_password_changed}
      META_WHATSAPP_TEMPLATE_PATIENT_TRANSFER: ${META_WHATSAPP_TEMPLATE_PATIENT_TRANSFER:-ulwembu_patient_transfer}
      META_WHATSAPP_TEMPLATE_STAFF_ACCOUNT_CREATED: ${META_WHATSAPP_TEMPLATE_STAFF_ACCOUNT_CREATED:-ulwembu_staff_account_created}
      META_WHATSAPP_TEMPLATE_STAFF_PASSWORD_RESET: ${META_WHATSAPP_TEMPLATE_STAFF_PASSWORD_RESET:-ulwembu_staff_password_reset}
      META_WHATSAPP_TEMPLATE_PRESCRIBER_QUERY: ${META_WHATSAPP_TEMPLATE_PRESCRIBER_QUERY:-ulwembu_prescriber_query}
      META_WHATSAPP_TEMPLATE_ORGANISATION_ADMIN_WELCOME: ${META_WHATSAPP_TEMPLATE_ORGANISATION_ADMIN_WELCOME:-ulwembu_organisation_admin_welcome}
      META_WHATSAPP_TEMPLATE_PLATFORM_OPERATOR_WELCOME: ${META_WHATSAPP_TEMPLATE_PLATFORM_OPERATOR_WELCOME:-ulwembu_platform_operator_welcome}
      META_WHATSAPP_TEMPLATE_NEW_SIGN_IN: ${META_WHATSAPP_TEMPLATE_NEW_SIGN_IN:-ulwembu_new_sign_in}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../E-Health-System-dev-frontend-ulwembu
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8081
    volumes:
      - ../E-Health-System-dev-frontend-ulwembu:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules: