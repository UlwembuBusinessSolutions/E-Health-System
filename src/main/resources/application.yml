server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ulwembu-platform-api

  # dev is the only profile this codebase defines right now.
  # It turns on PlatformOperatorBootstrap.
  # Leave it active for this environment.dddd
  
  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ulwembus}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Linhle@12}
    hikari:
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  # Migrations run per-schema via TenantMigrationRunner.
  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

      # Short timeouts on purpose because no real SMTP server
      # is configured in this environment.
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

app:
  jwt:
    secret: ${JWT_SECRET:vfVifMQarglDAZJg64W7tHxpHVzzQC6BbtFO/u6MJrM=}
    access-token-ttl-minutes: 720

  idle-lock:
    timeout-minutes: ${IDLE_LOCK_TIMEOUT_MINUTES:15}

  security:
    bcrypt-strength: 12

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}

  platform:
    jwt-secret: ${PLATFORM_JWT_SECRET:7Ipie63gxaJcJf7E9lm5ePF8Tib6MsBxl9K4WU0lMAU=}
    access-token-ttl-minutes: 60

    bootstrap:
      email: ${PLATFORM_BOOTSTRAP_EMAIL:ops@ulwembu.example}
      password: ${PLATFORM_BOOTSTRAP_PASSWORD:ChangeMe123!}
      first-name: ${PLATFORM_BOOTSTRAP_FIRST_NAME:Platform}
      last-name: ${PLATFORM_BOOTSTRAP_LAST_NAME:Operator}

  storage:
    region: ${STORAGE_REGION:af-south-1}
    bucket-name: ${STORAGE_BUCKET_NAME:ulwembu-app-storage-dev}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://ulwembu-app-storage-dev.s3.af-south-1.amazonaws.com}

  notifications:
    from-address: ${NOTIFICATIONS_FROM_ADDRESS:no-reply@ulwembu.example}

    # Every outbound email gets written here before the real send
    # is attempted.
    capture-dir: ${NOTIFICATIONS_CAPTURE_DIR:./data/emails}

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health

  health:
    # EmailService treats a failed send as non-fatal.
    # Keep the mail health indicator disabled so an unavailable
    # SMTP server does not make overall application health DOWN.
    mail:
      enabled: false

