server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ulwembu-platform-api
  # dev is the only profile this codebase defines right now — it turns on
  # PlatformOperatorBootstrap (platform/PlatformOperatorBootstrap.java), the
  # local-only "create the first platform operator" runner. Leave it active
  # for this environment; a real deployment would drop it.
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ulwembu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Linhle@12}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false  # migrations run per-schema via TenantMigrationRunner — see core/tenant
  servlet:
    multipart:
      max-file-size: 5MB   # enforced before StaffPhotoService and CollectionProofStorage run
      max-request-size: 5MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Short timeouts on purpose: no real SMTP server is configured in
      # this environment, so every send is expected to fail — this just
      # makes it fail in milliseconds instead of hanging on a connect
      # timeout for whatever the JVM default is.
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

app:
  jwt:
    secret: ${JWT_SECRET:vfVifMQarglDAZJg64W7tHxpHVzzQC6BbtFO/u6MJrM=}
    access-token-ttl-minutes: 720
  idle-lock:
    timeout-minutes: ${IDLE_LOCK_TIMEOUT_MINUTES:15}
  security:
    bcrypt-strength: 12
    # AES-256 key (base64, 32 raw bytes) for core/common/SecretEncryptor —
    # currently only used to encrypt-at-rest a tenant's own SMTP password
    # (OrganizationMailSettings). Same "committed dev default, real value
    # from env in any other environment" pattern as jwt.secret above.
    secrets-key: ${ORG_SECRETS_ENCRYPTION_KEY:WOmNLAhh7uzmPJpau3OVhXehfSoaKprBtkmQEVxRA2U=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}
  platform:
    jwt-secret: ${PLATFORM_JWT_SECRET:7Ipie63gxaJcJf7E9lm5ePF8Tib6MsBxl9K4WU0lMAU=}
    access-token-ttl-minutes: 60
    bootstrap:
      email: ${PLATFORM_BOOTSTRAP_EMAIL:ops@ulwembu.example}
      password: ${PLATFORM_BOOTSTRAP_PASSWORD:ChangeMe123!}
      first-name: ${PLATFORM_BOOTSTRAP_FIRST_NAME:Platform}
      last-name: ${PLATFORM_BOOTSTRAP_LAST_NAME:Operator}
  patient:
    # A third signing key, separate from both app.jwt.secret (staff) and
    # app.platform.jwt-secret — PatientJwtService's own why-note on why.
    jwt-secret: ${PATIENT_JWT_SECRET:DFBOWf4xTML00JWTEK1NYyL6gmsM4qTQF5eqEulMAko=}
    access-token-ttl-minutes: 720
  storage:
    region: ${STORAGE_REGION:af-south-1}
    bucket-name: ${STORAGE_BUCKET_NAME:ulwembu-app-storage-dev}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://ulwembu-app-storage-dev.s3.af-south-1.amazonaws.com}
  notifications:
    provider: ${NOTIFICATIONS_PROVIDER:smtp}
    from-address: ${NOTIFICATIONS_FROM_ADDRESS:no-reply@ulwembu.example}
    from-name: ${NOTIFICATIONS_FROM_NAME:Verify}
    microsoft-graph:
      tenant-id: ${MS_GRAPH_TENANT_ID:}
      client-id: ${MS_GRAPH_CLIENT_ID:}
      client-secret: ${MS_GRAPH_CLIENT_SECRET:}
    # Every outbound email gets written here before the real send is
    # attempted — see core/notification/EmailService.java. Relative to
    # wherever the app is started from.
    capture-dir: ${NOTIFICATIONS_CAPTURE_DIR:./data/emails}
    aws:
      sms-region: ${AWS_SMS_REGION:eu-west-1}
      sms-enabled: ${AWS_SMS_ENABLED:false}
    whatsapp:
      access-token: ${META_WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${META_WHATSAPP_PHONE_NUMBER_ID:}
      api-version: ${META_WHATSAPP_API_VERSION:v26.0}
      queue-template-name: ${META_WHATSAPP_QUEUE_TEMPLATE_NAME:}
      template-language: ${META_WHATSAPP_TEMPLATE_LANGUAGE:en_US}
      enabled: ${META_WHATSAPP_ENABLED:false}
      # Override individual names when the approved names in Meta differ from
      # the catalogue defaults. Keys use the catalogue IDs in kebab-case.
      template-names:
        medication-ready: ${META_WHATSAPP_TEMPLATE_MEDICATION_READY:ulwembu_medication_ready}
        medication-collection-reminder: ${META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTION_REMINDER:ulwembu_medication_collection_reminder}
        medication-collection-overdue: ${META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTION_OVERDUE:ulwembu_medication_collection_overdue}
        medication-partially-ready: ${META_WHATSAPP_TEMPLATE_MEDICATION_PARTIALLY_READY:ulwembu_medication_partially_ready}
        medication-delayed: ${META_WHATSAPP_TEMPLATE_MEDICATION_DELAYED:ulwembu_medication_delayed}
        medication-collected: ${META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTED:ulwembu_medication_collected}
        medication-collection-changed: ${META_WHATSAPP_TEMPLATE_MEDICATION_COLLECTION_CHANGED:ulwembu_medication_collection_changed}
        repeat-prescription-review: ${META_WHATSAPP_TEMPLATE_REPEAT_PRESCRIPTION_REVIEW:ulwembu_repeat_prescription_review}
        appointment-confirmed: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_CONFIRMED:ulwembu_appointment_confirmed}
        appointment-reminder: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER:ulwembu_appointment_reminder}
        appointment-today: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_TODAY:ulwembu_appointment_today}
        appointment-rescheduled: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_RESCHEDULED:ulwembu_appointment_rescheduled}
        appointment-cancelled: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_CANCELLED:ulwembu_appointment_cancelled}
        appointment-missed: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_MISSED:ulwembu_appointment_missed}
        appointment-request-received: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_REQUEST_RECEIVED:ulwembu_appointment_request_received}
        appointment-waitlist-offer: ${META_WHATSAPP_TEMPLATE_APPOINTMENT_WAITLIST_OFFER:ulwembu_appointment_waitlist_offer}
        visit-checked-in: ${META_WHATSAPP_TEMPLATE_VISIT_CHECKED_IN:ulwembu_visit_checked_in}
        queue-called: ${META_WHATSAPP_TEMPLATE_QUEUE_CALLED:ulwembu_queue_called}
        follow-up-requested: ${META_WHATSAPP_TEMPLATE_FOLLOW_UP_REQUESTED:ulwembu_follow_up_requested}
        results-available: ${META_WHATSAPP_TEMPLATE_RESULTS_AVAILABLE:ulwembu_results_available}
        secure-message: ${META_WHATSAPP_TEMPLATE_SECURE_MESSAGE:ulwembu_secure_message}
        patient-welcome: ${META_WHATSAPP_TEMPLATE_PATIENT_WELCOME:ulwembu_patient_welcome}
        patient-verification-code: ${META_WHATSAPP_TEMPLATE_PATIENT_VERIFICATION_CODE:ulwembu_patient_verification_code}
        password-reset-code: ${META_WHATSAPP_TEMPLATE_PASSWORD_RESET_CODE:ulwembu_password_reset_code}
        password-changed: ${META_WHATSAPP_TEMPLATE_PASSWORD_CHANGED:ulwembu_password_changed}
        patient-transfer: ${META_WHATSAPP_TEMPLATE_PATIENT_TRANSFER:ulwembu_patient_transfer}
        staff-account-created: ${META_WHATSAPP_TEMPLATE_STAFF_ACCOUNT_CREATED:ulwembu_staff_account_created}
        staff-password-reset: ${META_WHATSAPP_TEMPLATE_STAFF_PASSWORD_RESET:ulwembu_staff_password_reset}
        prescriber-query: ${META_WHATSAPP_TEMPLATE_PRESCRIBER_QUERY:ulwembu_prescriber_query}
        organisation-admin-welcome: ${META_WHATSAPP_TEMPLATE_ORGANISATION_ADMIN_WELCOME:ulwembu_organisation_admin_welcome}
        platform-operator-welcome: ${META_WHATSAPP_TEMPLATE_PLATFORM_OPERATOR_WELCOME:ulwembu_platform_operator_welcome}
        new-sign-in: ${META_WHATSAPP_TEMPLATE_NEW_SIGN_IN:ulwembu_new_sign_in}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  backend:
    # This app's own public origin — used only to build the Microsoft SSO
    # redirect_uri (MicrosoftSsoService), which has to be an exact,
    # internet-reachable URL an Azure AD app registration can be configured
    # with. Distinct from frontend.base-url above, which is where a human
    # lands; this is where Microsoft itself sends the browser back to.
    base-url: ${BACKEND_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # EmailService already treats a failed send as non-fatal — logs and
    # captures to disk, never throws past itself (see its own why-note).
    # Wiring the actuator's mail indicator into overall app health would
    # mean an unreachable SMTP server (expected in this environment, and
    # not something an orchestrator's restart/routing decision should ever
    # hinge on) makes /actuator/health report DOWN for a reason that isn't
    # actually a reason this app can't serve requests.
    mail:
      enabled: false
