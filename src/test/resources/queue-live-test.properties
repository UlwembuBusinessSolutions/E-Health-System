spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.mail.host=localhost
spring.mail.port=1
app.security.bcrypt-strength=4
app.jwt.access-token-ttl-minutes=60
app.platform.access-token-ttl-minutes=60
app.idle-lock.timeout-minutes=60
app.cors.allowed-origins=http://localhost:5173,http://localhost:5180
app.storage.region=af-south-1
app.storage.bucket-name=live-test-unused
app.storage.public-base-url=http://localhost/unused
app.notifications.from-address=test@live.example
app.notifications.capture-dir=./target/queue-live-emails
app.frontend.base-url=http://localhost:5173
logging.level.root=WARN
