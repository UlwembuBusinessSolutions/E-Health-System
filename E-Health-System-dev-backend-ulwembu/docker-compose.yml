services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ulwembu
      POSTGRES_USER: ulwembu
      POSTGRES_PASSWORD: ulwembu_dev_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulwembu -d ulwembu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ulwembu
      DB_USERNAME: ulwembu
      DB_PASSWORD: ulwembu_dev_local
      SMTP_HOST: ${SMTP_HOST:-smtp-mail.outlook.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFICATIONS_FROM_ADDRESS: ${NOTIFICATIONS_FROM_ADDRESS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../../E-Health-Frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8081
    volumes:
      - ../../E-Health-Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules:
