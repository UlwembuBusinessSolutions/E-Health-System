spring:
  application:
    name: ulwembu-api-test

  datasource:
    url: jdbc:postgresql://localhost:5432/ulwembu_test
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/control,classpath:db/migration/tenant

  mail:
    host: localhost
    port: 1025
    username: admin
    password: admin

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-do-not-use-in-production
    expiration-ms: 3600000
  storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: ulwembu-dev
  tenants:
    default-tenant: test-tenant
